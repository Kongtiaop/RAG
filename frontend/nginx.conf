server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器（compose 网络内主机名 api）
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE 必须关闭缓冲
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # MCP Streamable HTTP（token 门禁：客户端须带 X-MCP-Token 头）
    # ${MCP_TOKEN} 由 nginx docker 入口的 envsubst 从容器环境注入
    location /mcp/ {
        if ($http_x_mcp_token != "${MCP_TOKEN}") {
            return 403;
        }
        proxy_pass http://mcp:9001/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
