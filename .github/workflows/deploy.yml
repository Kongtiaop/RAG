name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/kongtiaop/agentic-rag-backend
  FRONTEND_IMAGE: ghcr.io/kongtiaop/agentic-rag-frontend
  POSTGRES_IMAGE: ghcr.io/kongtiaop/agentic-rag-postgres

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror postgres image to GHCR (国内服务器拉不动 Docker Hub，统一走 GHCR)
        run: |
          docker pull paradedb/paradedb:pg16
          docker tag paradedb/paradedb:pg16 ${{ env.POSTGRES_IMAGE }}:pg16
          docker push ${{ env.POSTGRES_IMAGE }}:pg16

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 国内服务器访问 github.com 不稳定：不用 git pull，
      # compose 文件由 Actions 直接 scp 上去（镜像走 GHCR，代码在镜像里，服务器无需仓库）
      - name: Upload compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: docker-compose.prod.yml
          target: /opt/agentic_rag

      - name: SSH deploy (pull images + incremental ingest + health check)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/agentic_rag
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 5
            docker compose -f docker-compose.prod.yml run --rm api python -m app.ingest
            curl -sf http://127.0.0.1:8000/health
            echo "deploy ok"
