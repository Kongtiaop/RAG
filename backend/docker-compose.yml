services:
  postgres:
    image: paradedb/paradedb:pg16   # PG16 + pgvector 0.8 + pg_search(BM25)，PGDATA 路径与 pgvector 镜像一致，卷无缝换引擎
    container_name: agentic_rag_pg
    environment:
      POSTGRES_USER: agentic_rag
      POSTGRES_PASSWORD: agentic_rag
      POSTGRES_DB: agentic_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_rag -d agentic_rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 2C2G 服务器部署时建议追加：
    # command: postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c max_connections=50

  api:
    build: .
    container_name: agentic_rag_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agentic_rag:agentic_rag@postgres:5432/agentic_rag
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ..:/app          # 挂载项目根：代码 + docs 语料（摄取用）

volumes:
  pgdata:
